dist: focal
language: ruby
rvm:
- 2.7
script:
- ruby -e 'puts ENV["MY_ENV"] || "Hello, World!"'
before_deploy:
  - 'echo "travis internal ruby is: $(travis_internal_ruby)"'
  - 'echo "custom ruby is: $(ruby -v)"'
deploy:
  provider: pages:git
  edge:
    branch: test_deploy_ruby_2x
    source: DominikAlberski/dpl
  token: "$GITHUB_TOKEN"
  verbose: true
  cleanup: false
  keep_history: true
  url: github.com
  local_dir: pages/
  on:
    branch: deploy_with_custom_dpl_gem_ruby2
